# Configuración SOLO para las pruebas (mvnw test).
# Reemplaza a src/main/resources/application.properties: usa H2 en memoria,
# así las pruebas no necesitan la contraseña de PostgreSQL ni tocan datos reales.
spring.application.name=walletix
spring.datasource.url=jdbc:h2:mem:walletix_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
